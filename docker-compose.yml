services:
  db:
    image: postgres:16
    container_name: walo_postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - walo_data:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walo -d walo_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server

    env_file:
      - ./server/.env

    ports:
      - "3000:3000"

    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}

    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client

    ports:
      - "5173:5173"

    depends_on:
      - server

volumes:
  walo_data: